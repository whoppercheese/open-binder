services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binder}
      POSTGRES_DB: ${POSTGRES_DB:-binder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-binder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-binder}:${POSTGRES_PASSWORD:-binder}@postgres:5432/${POSTGRES_DB:-binder}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command: npm run start
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-binder}:${POSTGRES_PASSWORD:-binder}@postgres:5432/${POSTGRES_DB:-binder}
      IMAGE_STORAGE_PATH: /app/storage/images
      NODE_ENV: production
    volumes:
      - image_storage:/app/storage/images
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-binder}:${POSTGRES_PASSWORD:-binder}@postgres:5432/${POSTGRES_DB:-binder}
      IMAGE_STORAGE_PATH: /app/storage/images
      BOOTSTRAP_CATALOG_SYNC: ${BOOTSTRAP_CATALOG_SYNC:-true}
      CATALOG_SET_IDS: ${CATALOG_SET_IDS:-}
      NODE_ENV: production
    volumes:
      - image_storage:/app/storage/images
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  image_storage:
